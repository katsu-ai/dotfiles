# =============================================================================
# Hyprland config — CachyOS + Caelestia setup
# =============================================================================

# ---------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------
monitor=,preferred,auto,1

# ---------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------
exec-once = awww-daemon
exec-once = swww-daemon
exec-once = swww img /home/kurasako/devushka_gejmpad_gejmer_1313139_3840x2160.jpg --transition-type none
exec-once = qs -c caelestia
exec-once = nwg-dock-hyprland -nows -id -mb 8 -ml 8 -mr 8 -p bottom -hd 0
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
    }
}

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(b4befe88) rgba(cba6f788) 45deg
    col.inactive_border = rgba(31324488)
    layout = dwindle
    resize_on_border = true
}

# ---------------------------------------------------------------------------
# Decoration
# ---------------------------------------------------------------------------
decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2e88)
    }
}

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
animations {
    enabled = yes
    bezier = easeOut,0.16,1,0.3,1
    bezier = easeIn,0.7,0,0.84,0
    bezier = spring,0.175,0.885,0.32,1.275

    animation = windows,1,4,spring,slide
    animation = windowsOut,1,3,easeIn,slide
    animation = border,1,6,default
    animation = borderangle,1,8,default
    animation = fade,1,3,easeOut
    animation = workspaces,1,4,easeOut,slide
    animation = specialWorkspace,1,3,easeOut,slidevert
}

# ---------------------------------------------------------------------------
# Layouts
# ---------------------------------------------------------------------------
dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty|foot)$
}

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = google-chrome-stable

# ---------------------------------------------------------------------------
# Keybindings — основные
# ---------------------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, tofi-drun --drun-launch=true
bind = $mainMod SHIFT, R, exec, pkill -USR1 waybar
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglesplit
bind = $mainMod, Space, togglefloating

# ---------------------------------------------------------------------------
# Minimise → special:minimized  (как на скриншотах)
# ---------------------------------------------------------------------------
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod, N, togglespecialworkspace, minimized

# ---------------------------------------------------------------------------
# Фокус
# ---------------------------------------------------------------------------
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ---------------------------------------------------------------------------
# Перемещение окон
# ---------------------------------------------------------------------------
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ---------------------------------------------------------------------------
# Рабочие пространства
# ---------------------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Tab, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ---------------------------------------------------------------------------
# Мышь
# ---------------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------------------------
# Медиаклавиши
# ---------------------------------------------------------------------------
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind   = , XF86AudioPlay,  exec, playerctl play-pause
bind   = , XF86AudioNext,  exec, playerctl next
bind   = , XF86AudioPrev,  exec, playerctl previous

# ---------------------------------------------------------------------------
# Скриншоты
# ---------------------------------------------------------------------------
bind = , Print,        exec, hyprshot -m output
bind = SHIFT, Print,   exec, hyprshot -m region
bind = $mainMod, Print, exec, hyprshot -m window

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(thunar)$, title:^(?!.*Thunar$)
windowrulev2 = float, class:^(nwg-dock-hyprland)$
windowrulev2 = noblur, class:^(nwg-dock-hyprland)$
windowrulev2 = noshadow, class:^(nwg-dock-hyprland)$

# special workspace — окна-минималки не видны в обычном layouts
windowrulev2 = float,    special:minimized
windowrulev2 = workspace special:minimized silent, special:minimized
